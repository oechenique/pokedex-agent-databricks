# Databricks App config -- esqueleto de validación del segundo intento
# de frontend real (reglas/07-estado-actual.md). Mismo patrón sin
# Dockerfile que mcp_server/oak_app: python -m backend.app (no
# `python backend/app.py`, rompería los imports relativos del paquete
# backend/ -- ver nota en backend/app.py).
command: ["python", "-m", "backend.app"]

env:
  - name: FRONTEND_ORIGIN
    value: "https://pokedex-web-7405616363788532.12.azure.databricksapps.com"
  - name: MCP_SERVER_URL
    value: "https://pokedex-mcp-server-7405616363788532.12.azure.databricksapps.com"
  # Mismo databricks_secret que ya usa oak_app (terraform/oak_app.tf) --
  # nunca texto plano acá (reglas/05-guardrails-seguridad.md).
  - name: ANTHROPIC_API_KEY
    valueFrom: "anthropic_api_key"
